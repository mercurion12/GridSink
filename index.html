<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridsink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090d;
      --grid: rgba(255,255,255,0.04);
      --accent: #00ffc3;
      --accent2: #0066ff;
      --text: #e8eaf0;
      --muted: rgba(232,234,240,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated grid background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0%   { background-position: 0 0; }
      100% { background-position: 48px 48px; }
    }

    /* Glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 600px; height: 600px;
      background: var(--accent2);
      top: -150px; left: -150px;
      animation: blobFloat 12s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: var(--accent);
      bottom: -100px; right: -100px;
      animation: blobFloat 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Scan line effect */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 700px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 3rem;
      animation: fadeDown 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 3px;
    }

    .logo-icon span {
      border-radius: 2px;
      background: var(--accent);
      animation: gridPulse 2.4s ease-in-out infinite;
    }
    .logo-icon span:nth-child(1) { animation-delay: 0.0s; }
    .logo-icon span:nth-child(2) { animation-delay: 0.1s; background: var(--accent2); }
    .logo-icon span:nth-child(3) { animation-delay: 0.2s; }
    .logo-icon span:nth-child(4) { animation-delay: 0.3s; background: var(--accent2); }
    .logo-icon span:nth-child(5) { animation-delay: 0.4s; }
    .logo-icon span:nth-child(6) { animation-delay: 0.5s; background: var(--accent2); }
    .logo-icon span:nth-child(7) { animation-delay: 0.6s; }
    .logo-icon span:nth-child(8) { animation-delay: 0.7s; background: var(--accent2); }
    .logo-icon span:nth-child(9) { animation-delay: 0.8s; }

    @keyframes gridPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    .logo-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,255,195,0.07);
      border: 1px solid rgba(0,255,195,0.25);
      border-radius: 99px;
      padding: 6px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.8s 0.15s cubic-bezier(0.16,1,0.3,1) both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      animation: fadeDown 0.8s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 3rem;
      font-weight: 400;
      animation: fadeDown 0.8s 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      margin: 0 auto 3rem;
      border-radius: 2px;
      animation: fadeDown 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .progress-wrap {
      animation: fadeDown 0.8s 0.45s cubic-bezier(0.16,1,0.3,1) both;
      margin-bottom: 3rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width 2s cubic-bezier(0.16,1,0.3,1);
    }

    .contact {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: fadeDown 0.8s 0.55s cubic-bezier(0.16,1,0.3,1) both;
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(0,255,195,0.3);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .contact a:hover {
      color: #fff;
      border-color: #fff;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* corner decorations */
    .corner {
      position: fixed;
      width: 32px;
      height: 32px;
      opacity: 0.3;
      z-index: 5;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--accent);
    }
    .corner::before { width: 2px; height: 100%; }
    .corner::after  { width: 100%; height: 2px; }

    .corner-tl { top: 24px; left: 24px; }
    .corner-tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .corner-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .corner-br { bottom: 24px; right: 24px; transform: scale(-1); }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">

    <div class="logo-wrap">
      <div class="logo-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <div class="logo-name">Gridsink</div>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Im Aufbau
    </div>

    <h1>Etwas Großes<br>entsteht <em>gerade.</em></h1>

    <div class="divider"></div>

    <p class="subtitle">
      Wir arbeiten mit Hochdruck daran, unsere Plattform für euch bereit zu machen.
      Schaut bald wieder vorbei — es lohnt sich.
    </p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Fortschritt</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="bar"></div>
      </div>
    </div>

    <p class="contact">
      Fragen? Schreib uns: <a href="mailto:gridsink@gmail.com">gridsink@gmail.com</a>
    </p>

  </div>

  <script>
    // Animate progress bar to a "realistic" wip value
    const target = 37;
    setTimeout(() => {
      document.getElementById('bar').style.width = target + '%';
      let current = 0;
      const interval = setInterval(() => {
        current++;
        document.getElementById('pct').textContent = current + '%';
        if (current >= target) clearInterval(interval);
      }, 2000 / target);
    }, 800);
  </script>

</body>
</html>
