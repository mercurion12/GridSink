<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>??? — Gridsink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#08090d; --grid:rgba(255,255,255,0.04); --accent:#00ffc3; --accent2:#0066ff; --text:#e8eaf0; --muted:rgba(232,234,240,0.4); }
    body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; }
    .grid-bg { position:fixed; inset:0; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:48px 48px; animation:gridShift 20s linear infinite; z-index:0; }
    @keyframes gridShift { 0%{background-position:0 0} 100%{background-position:48px 48px} }
    .blob { position:fixed; border-radius:50%; filter:blur(120px); opacity:0.18; pointer-events:none; z-index:0; }
    .blob-1 { width:600px; height:600px; background:var(--accent2); top:-150px; left:-150px; animation:blobFloat 12s ease-in-out infinite alternate; }
    .blob-2 { width:500px; height:500px; background:var(--accent); bottom:-100px; right:-100px; animation:blobFloat 16s ease-in-out infinite alternate-reverse; }
    @keyframes blobFloat { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(40px,30px) scale(1.08)} }
    body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px); pointer-events:none; z-index:100; }
    .corner { position:fixed; width:32px; height:32px; opacity:0.3; z-index:5; }
    .corner::before,.corner::after { content:''; position:absolute; background:var(--accent); }
    .corner::before { width:2px; height:100%; }
    .corner::after  { width:100%; height:2px; }
    .corner-tl { top:20px; left:20px; }
    .corner-tr { top:20px; right:20px; transform:scaleX(-1); }
    .corner-bl { bottom:24px; left:24px; transform:scaleY(-1); }
    .corner-br { bottom:24px; right:24px; transform:scale(-1); }

    /* back link */
    .back { position:fixed; top:24px; left:24px; z-index:20; font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:8px; transition:color 0.2s; }
    .back:hover { color:var(--accent); }

    /* container */
    .container { position:relative; z-index:10; text-align:center; padding:2rem; max-width:480px; width:100%; animation:fadeDown 0.8s cubic-bezier(0.16,1,0.3,1) both; }

    .badge { display:inline-flex; align-items:center; gap:8px; background:rgba(0,255,195,0.07); border:1px solid rgba(0,255,195,0.25); border-radius:99px; padding:6px 16px; font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.12em; color:var(--accent); text-transform:uppercase; margin-bottom:2rem; }
    .badge-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1.4s ease-in-out infinite; }

    h1 { font-size:clamp(2rem,6vw,3.2rem); font-weight:800; line-height:1.1; letter-spacing:-0.02em; margin-bottom:1rem; }
    h1 em { font-style:normal; color:var(--accent); }
    .lead { font-size:0.95rem; color:var(--muted); line-height:1.75; margin-bottom:2.5rem; }

    .divider { width:40px; height:2px; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:2px; margin:0 auto 2.5rem; }

    /* GAME AREA */
    #game-area { width:100%; }

    /* Memory grid */
    .memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.5rem; }
    .mem-card {
      aspect-ratio:1; border-radius:6px; cursor:pointer;
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:center;
      font-size:1.4rem; transition:transform 0.15s, border-color 0.2s, background 0.2s;
      user-select:none; position:relative; perspective:600px;
    }
    .mem-card:hover:not(.flipped):not(.matched) { border-color:rgba(0,255,195,0.2); background:rgba(0,255,195,0.04); transform:scale(1.04); }
    .mem-card .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:6px; backface-visibility:hidden; transition:transform 0.35s; }
    .mem-card .front { transform:rotateY(180deg); background:rgba(0,255,195,0.07); border:1px solid rgba(0,255,195,0.2); font-size:1.5rem; }
    .mem-card .back  { transform:rotateY(0deg); }
    .mem-card.flipped .front { transform:rotateY(0deg); }
    .mem-card.flipped .back  { transform:rotateY(-180deg); }
    .mem-card.matched { border-color:rgba(0,255,195,0.4); background:rgba(0,255,195,0.06); cursor:default; }
    .mem-card.matched .front { background:rgba(0,255,195,0.1); }

    /* score bar */
    .score-bar { display:flex; justify-content:space-between; align-items:center; font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:1rem; }
    .score-bar span { display:flex; align-items:center; gap:6px; }
    .score-val { color:var(--accent); }

    /* win screen */
    #win-screen { display:none; text-align:center; animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
    #win-screen .win-icon { font-size:2.5rem; margin-bottom:1rem; }
    #win-screen h2 { font-size:1.4rem; font-weight:800; margin-bottom:0.5rem; }
    #win-screen p { font-size:0.88rem; color:var(--muted); margin-bottom:1.5rem; line-height:1.6; }
    .btn-restart { font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); background:transparent; border:1px solid rgba(0,255,195,0.35); border-radius:4px; padding:10px 20px; cursor:pointer; transition:background 0.2s,color 0.2s; }
    .btn-restart:hover { background:rgba(0,255,195,0.08); color:#fff; }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(16px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div><div class="corner corner-br"></div>

  <a class="back" href="produkt.html">← Zurück</a>

  <div class="container">
    <div class="badge"><span class="badge-dot"></span>Geheimer Bereich</div>
    <h1>Du hast es<br><em>gefunden.</em></h1>
    <div class="divider"></div>
    <p class="lead">Willkommen im versteckten Bereich. Finde alle Paare.</p>

    <div id="game-area">
      <div class="score-bar">
        <span>Paare <span class="score-val" id="pairs-found">0</span> / 8</span>
        <span>Züge <span class="score-val" id="moves">0</span></span>
      </div>
      <div class="memory-grid" id="grid"></div>
    </div>

    <div id="win-screen">
      <div class="win-icon">✦</div>
      <h2>Alle Paare gefunden!</h2>
      <p id="win-msg"></p>
      <button class="btn-restart" onclick="initGame()">Nochmal spielen →</button>
    </div>
  </div>

  <script>
    const EMOJIS = ['⚡','🔒','🛰','💾','🔗','🧩','📡','🌐'];
    let cards = [], flipped = [], matched = 0, moves = 0, locked = false;

    function shuffle(arr) {
      for (let i=arr.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    function initGame() {
      matched = 0; moves = 0; flipped = []; locked = false;
      document.getElementById('pairs-found').textContent = '0';
      document.getElementById('moves').textContent = '0';
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';

      const deck = shuffle([...EMOJIS,...EMOJIS]);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards = [];

      deck.forEach((emoji, i) => {
        const card = document.createElement('div');
        card.className = 'mem-card';
        card.innerHTML = `
          <div class="face back"><span style="font-size:0.7rem;font-family:'Space Mono',monospace;color:var(--muted)">?</span></div>
          <div class="face front">${emoji}</div>`;
        card.dataset.emoji = emoji;
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
        cards.push(card);
      });
    }

    function flipCard(card) {
      if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);
      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        locked = true;
        const [a, b] = flipped;
        if (a.dataset.emoji === b.dataset.emoji) {
          a.classList.add('matched');
          b.classList.add('matched');
          matched++;
          document.getElementById('pairs-found').textContent = matched;
          flipped = []; locked = false;
          if (matched === 8) setTimeout(showWin, 400);
        } else {
          setTimeout(() => {
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            flipped = []; locked = false;
          }, 900);
        }
      }
    }

    function showWin() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('win-screen').style.display = 'block';
      const rating = moves <= 12 ? 'Beeindruckend — kaum Fehler gemacht.' : moves <= 20 ? 'Gut gespielt.' : 'Geschafft!';
      document.getElementById('win-msg').textContent = `${moves} Züge für alle 8 Paare. ${rating}`;
    }

    initGame();
  </script>
</body>
</html>
